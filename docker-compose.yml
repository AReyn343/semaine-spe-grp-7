services:

  # ─────────────────────────────────────────
  # 🛢 MySQL
  # ─────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: grp7-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: group7bdd
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ─────────────────────────────────────────
  # 🚀 Application Spring Boot (scalable)
  # NE PAS mettre container_name ici
  # → permet docker compose up --scale app=N
  # ─────────────────────────────────────────
  app:
    build: .
    expose:
      - "8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/group7bdd?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ─────────────────────────────────────────
  # ⚖️ Nginx — Load Balancer
  # Expose le port 8080 (remplace l'app directe)
  # ─────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: grp7-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    restart: unless-stopped

  # ─────────────────────────────────────────
  # 🗄 phpMyAdmin
  # ─────────────────────────────────────────
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: grp7-phpmyadmin
    ports:
      - "8081:80"
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: root
    depends_on:
      mysql:
        condition: service_healthy

  # ─────────────────────────────────────────
  # 📡 Prometheus
  # Scrape Nginx (qui répartit vers les instances)
  # ─────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: grp7-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    depends_on:
      - nginx
    restart: unless-stopped

  # ─────────────────────────────────────────
  # 📊 Grafana
  # ─────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: grp7-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  mysql_data:
  prometheus_data:
  grafana_data:
