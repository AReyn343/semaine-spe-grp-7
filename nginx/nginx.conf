# ─────────────────────────────────────────────────────────────
# Nginx — Load Balancer pour le scaling horizontal
# Groupe 7 — SUP DE VINCI
# ─────────────────────────────────────────────────────────────

events {
    worker_connections 1024;
}

http {

    # ── Upstream : instances Spring Boot ─────────────────────
    # Docker Compose résout "app" vers toutes les instances
    # quand on utilise --scale app=N
    upstream springboot_cluster {
        server app:8080;
        keepalive 32;
    }

    # ── Logs ─────────────────────────────────────────────────
    log_format main '$remote_addr - [$time_local] '
                    '"$request" $status '
                    'upstream: $upstream_addr '
                    'duration: ${request_time}s';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log  warn;

    # ── Timeouts ─────────────────────────────────────────────
    proxy_connect_timeout  10s;
    proxy_send_timeout     30s;
    proxy_read_timeout     30s;

    # ── Serveur principal ─────────────────────────────────────
    server {
        listen 80;
        server_name localhost;

        # ── Health check Nginx lui-même ───────────────────────
        location /nginx-health {
            access_log off;
            return 200 "nginx OK\n";
            add_header Content-Type text/plain;
        }

        # ── Actuator Prometheus — pour le scrape ─────────────
        location /actuator/ {
            proxy_pass         http://springboot_cluster;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        }

        # ── API v1 ────────────────────────────────────────────
        location /api/ {
            proxy_pass         http://springboot_cluster;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Instance-Count  "scaled";

            # Timeout pour les longues opérations
            proxy_read_timeout 30s;
        }

        # ── Pages statiques ───────────────────────────────────
        location / {
            proxy_pass         http://springboot_cluster;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
        }
    }
}
